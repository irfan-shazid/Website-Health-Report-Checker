{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  {% block theme_color %}
  <meta name="theme-color" content="#eceeea" media="(prefers-color-scheme: light)" data-light="#eceeea" data-dark="#0e1318">
  <meta name="theme-color" content="#0e1318" media="(prefers-color-scheme: dark)" data-light="#eceeea" data-dark="#0e1318">
  {% endblock %}
  <title>{% block title %}{% endblock %} · Site Health Report</title>
  <script src="{% static 'js/theme-init.js' %}"></script>
  <link rel="preload" href="{% static 'fonts/public-sans-latin-wght-normal.woff2' %}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{% static 'css/site.css' %}">
  <link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml">
  <script src="{% static 'js/app.js' %}" defer></script>
  {% block head %}{% endblock %}
</head>
<body class="min-h-dvh bg-desk font-sans text-ink antialiased">
  <a class="skip-link" href="#main">Skip to main content</a>
  {% block body %}{% endblock %}
</body>
</html>
