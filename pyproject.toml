[project]
name = "site-health-report"
version = "0.1.0"
description = "Passive website health reports: security headers, certificate, cookies, links and more."
requires-python = ">=3.12"
# Runtime dependencies only. Vercel installs these from here (it prefers
# pyproject.toml over requirements.txt). Keep them identical to requirements.txt;
# tests/test_deployment.py fails if the two drift. Test and build tools live in
# requirements-dev.txt.
dependencies = [
    "Django==5.2.17",
    "psycopg[binary]==3.3.6",
    "dj-database-url==3.1.2",
    "python-dotenv==1.2.3",
    "django-q2==1.11.1",
    "httpx==0.28.1",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.3",
    "WeasyPrint==70.0",
    "whitenoise==6.12.0",
]

# Vercel's build step: fail on insecure settings, then migrate. See reports/management/commands/predeploy.py.
[tool.vercel.scripts]
build = "python manage.py predeploy"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
addopts = "-ra"
